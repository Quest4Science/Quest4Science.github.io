{% include base_path %}

<!-- start custom head snippets -->

<!-- favicon -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/me.webp"/>
<link rel="icon" type="image/webp" href="{{ base_path }}/images/me.webp"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- MathJax: only load on pages that need it -->
{% if page.mathjax %}
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<!-- Shared analytics: records visits even while the footer panel is collapsed. -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/visitor-stats.css">
<script defer src="{{ base_path }}/assets/js/visitor-stats.js"></script>

<!-- end custom head snippets -->
